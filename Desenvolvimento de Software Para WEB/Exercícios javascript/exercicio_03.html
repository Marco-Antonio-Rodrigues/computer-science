<!-- Crie uma página com um parágrafo e dois botões: um “Ocultar” e um 
“Mostrar”. Ao clicar no botão Ocultar, modifique a propriedade 
style.display do parágrafo para none. Ao clicar no botão “Mostrar”, altere 
a propriedade style.display do parágrafo para block.   -->

<!DOCTYPE html>
<html>
<head>
    <title>Mostrar/Ocultar</title>
</head>
<body>
    <p id="paragrafo">Este é um parágrafo que pode ser ocultado.</p>
    <button onclick="ocultar()">Ocultar</button>
    <button onclick="mostrar()">Mostrar</button>

    <script>
        function ocultar() {
            document.getElementById('paragrafo').style.display = 'none';
        }

        function mostrar() {
            document.getElementById('paragrafo').style.display = 'block';
        }
    </script>
</body>
</html>
