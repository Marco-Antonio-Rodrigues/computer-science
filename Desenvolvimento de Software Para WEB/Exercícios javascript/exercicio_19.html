<!-- Escreva um script que receba três números fornecidos pelo usuário através de
um formulário exiba em os números digitados em forma de tabela, a soma, a
média, o produto, o maior e menor número. -->


<!DOCTYPE html>
<html>
<head>
    <title>Estatísticas de Números</title>
</head>
<body>
    <form id="numerosForm">
        <input type="number" id="num1" placeholder="Número 1"><br>
        <input type="number" id="num2" placeholder="Número 2"><br>
        <input type="number" id="num3" placeholder="Número 3"><br>
        <button type="button" onclick="calcular()">Calcular</button>
    </form>
    <table border="1" id="resultado">
        <thead>
            <tr>
                <th>Número</th>
                <th>Soma</th>
                <th>Média</th>
                <th>Produto</th>
                <th>Maior</th>
                <th>Menor</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <script>
        function calcular() {
            const num1 = parseFloat(document.getElementById('num1').value);
            const num2 = parseFloat(document.getElementById('num2').value);
            const num3 = parseFloat(document.getElementById('num3').value);
            const numeros = [num1, num2, num3];

            const soma = numeros.reduce((a, b) => a + b, 0);
            const media = soma / numeros.length;
            const produto = numeros.reduce((a, b) => a * b, 1);
            const maior = Math.max(...numeros);
            const menor = Math.min(...numeros);

            const tabela = document.querySelector('#resultado tbody');
            tabela.innerHTML = `
                <tr>
                    <td>${numeros.join(', ')}</td>
                    <td>${soma}</td>
                    <td>${media}</td>
                    <td>${produto}</td>
                    <td>${maior}</td>
                    <td>${menor}</td>
                </tr>`;
        }
    </script>
</body>
</html>
