<!-- Crie uma página HTML com um parágrafo. Ao clicar no parágrafo, altere a cor 
do texto para verde.  -->
<!DOCTYPE html>
<html>
<head>
    <title>Alterar Cor</title>
</head>
<body>
    <p onclick="alterarCor(this)">Clique para mudar a cor!</p>

    <script>
        function alterarCor(element) {
            element.style.color = 'green';
        }
    </script>
</body>
</html>
