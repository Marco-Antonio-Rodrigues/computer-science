<!-- Crie uma página com uma lista (select) com 4 opções de cores. Ao selecionar
uma opção de cor, altere o plano de fundo da página para a cor específica -->


<!DOCTYPE html>
<html>
<head>
    <title>Alterar Cor com Select</title>
</head>
<body>
    <select id="cores" onchange="alterarCor()">
        <option value="">Selecione uma cor</option>
        <option value="red">Vermelho</option>
        <option value="green">Verde</option>
        <option value="blue">Azul</option>
        <option value="yellow">Amarelo</option>
    </select>

    <script>
        function alterarCor() {
            const cor = document.getElementById('cores').value;
            document.body.style.backgroundColor = cor;
        }
    </script>
</body>
</html>
