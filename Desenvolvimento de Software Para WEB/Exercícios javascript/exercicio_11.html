<!-- Crie uma função que, ao ser chamada, cria um novo elemento <div> com o
    texto "Novo Div" e o adiciona ao final do body do documento. -->

<!DOCTYPE html>
<html>
<head>
    <title>Adicionar Div</title>
</head>
<body>
    <button onclick="adicionarDiv()">Adicionar Div</button>

    <script>
        function adicionarDiv() {
            const novaDiv = document.createElement('div');
            novaDiv.innerText = "Novo Div";
            document.body.appendChild(novaDiv);
        }
    </script>
</body>
</html>
